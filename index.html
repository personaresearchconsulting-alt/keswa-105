<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assessment Keswa MMPI-2 | Persona Research & Consulting</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #050533; --gold: #C5A059; --bg: #FFFFFF; }
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; margin: 0; padding: 0; }
        
        body { font-family: 'Inter', sans-serif; background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

        header {
            background: var(--navy); color: #E8D28E; padding: 15px; text-align: center;
            border-bottom: 4px solid var(--gold); font-weight: 800; font-size: 14px; 
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
        }

        .main-content { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; margin-top: 50px; 
        }

        .q-container { width: 100%; max-width: 600px; text-align: center; }
        .q-text { font-size: 22px; font-weight: 600; color: #000; margin-bottom: 35px; line-height: 1.4; min-height: 70px; }

        .ans-group { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .btn-ans { 
            width: 130px; padding: 20px; font-size: 18px; font-weight: 800; 
            border: 2px solid #EEE; border-radius: 12px; cursor: pointer; background: white; 
        }
        .btn-ans.active-ya { border-color: var(--navy); color: var(--navy); border-width: 3px; }
        .btn-ans.active-tidak { background: #ED6A5A; color: white; border-color: #ED6A5A; }

        .btn-back { background: none; border: none; color: #999; font-size: 12px; cursor: pointer; font-weight: 600; }

        .nav-section { background: #F9F9F9; border-top: 1px solid #EEE; padding: 10px; flex-shrink: 0; }
        .nav-scroll-area { max-width: 900px; margin: 0 auto; max-height: 100px; overflow-y: auto; padding: 2px; border: 1px solid #EEE; }
        .nav-grid { display: grid; grid-template-columns: repeat(30, 1fr); gap: 2px; }
        
        @media (max-width: 600px) { .nav-grid { grid-template-columns: repeat(15, 1fr); } }

        .nav-item { 
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center; 
            border: 1px solid #E0E0E0; font-size: 7px; border-radius: 1px; color: #AAA; background: white; cursor: pointer;
        }
        .nav-item.filled { background: var(--navy); color: white; border-color: var(--navy); }
        .nav-item.current { border: 1.5px solid var(--gold); background: #FFFDE7; color: var(--navy); font-weight: bold; }

        footer { background: var(--navy); color: white; text-align: center; padding: 8px; font-size: 10px; flex-shrink: 0; }

        .overlay { position: fixed; inset: 0; background: white; z-index: 1001; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { width: 100%; max-width: 380px; text-align: center; }
        
        .petunjuk {
            text-align: left; background: #fdfce5; padding: 15px; border-radius: 8px;
            border: 1px solid #e6db55; font-size: 12px; margin-bottom: 20px; line-height: 1.5; color: #555;
        }

        input, select { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #DDD; border-radius: 8px; }
        .btn-start { width: 100%; padding: 15px; background: var(--navy); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header>MMPI 2 - TES KESEHATAN MENTAL</header>

<div id="login-view" class="overlay">
    <div class="login-box">
        <h2 style="color: var(--navy); margin-bottom: 15px;">Autentikasi Tes</h2>
        <div class="petunjuk">
            <strong>PETUNJUK PENGERJAAN:</strong><br>
            1. Masukkan kata sandi dan data diri Anda.<br>
            2. Bacalah setiap pernyataan dengan teliti.<br>
            3. Pilih <b>YA</b> atau <b>TIDAK</b> sesuai dengan kondisi Anda.
        </div>
        <input type="password" id="password" placeholder="Masukkan Password (kes105)">
        <input type="text" id="nama" placeholder="Nama Lengkap">
        <select id="jk">
            <option value="">Jenis Kelamin</option>
            <option value="L">Laki-laki</option>
            <option value="P">Perempuan</option>
        </select>
        <button class="btn-start" onclick="mulaiTes()">MULAI TES</button>
    </div>
</div>

<div id="test-view" style="display:none; flex-direction: column; height: 100%;">
    <div class="main-content">
        <div class="q-container">
            <p id="q-count" style="font-size: 11px; color: var(--gold); font-weight: 700; margin-bottom: 5px;"></p>
            <div id="q-txt" class="q-text"></div>
            <div class="ans-group">
                <button id="btn-YA" class="btn-ans" onclick="simpan('YA')">YA</button>
                <button id="btn-TIDAK" class="btn-ans" onclick="simpan('TIDAK')">TIDAK</button>
            </div>
            <div style="margin-top: 20px;">
                <button class="btn-back" onclick="navigasi(-1)">← KEMBALI</button>
                <button onclick="selesai()" style="margin-left: 25px; background: #D9534F; color: white; padding: 8px 20px; border-radius: 6px; border: none; font-weight: 800; cursor: pointer;">SIMPAN & DOWNLOAD HASIL</button>
            </div>
        </div>
    </div>

    <div class="nav-section">
        <div class="nav-scroll-area">
            <div class="nav-grid" id="nav-grid"></div>
        </div>
    </div>

    <footer>Persona Research & Consulting &copy; 2026</footer>
</div>

<script>
const DATA_SOAL = Array.from({length: 567}, (_, i) => {
    const defaultList = [
        "Aku suka majalah teknik.", "Nafsu makanku baik.", "Aku bangun dengan rasa nyaman hampir setiap pagi.",
        "Aku mengira aku dapat menyukai pekerjaan perpustakaan.", "Aku mudah terbangun oleh suara berisik.",
        "Aku senang membaca berita kejahatan di surat kabar.", "Tangan dan kakiku biasanya terasa cukup hangat.",
        "Kehidupanku sehari-hari terisi penuh dengan hal-hal yang menyenangkan.", "Aku sanggup bekerja sebagaimana biasanya.",
        "Aku sering merasa seolah-olah ada yang menyumbat dalam leherku."
    ];
    return defaultList[i] || `Pernyataan tes kesehatan mental nomor ${i + 1}.`;
});

let currentIndex = 0;
let jawaban = new Array(567).fill(null);

function cekBatasPerangkat() {
    let registeredDevices = JSON.parse(localStorage.getItem('mmpi_devices') || '[]');
    let currentId = localStorage.getItem('mmpi_current_device_id');

    if (!currentId) {
        currentId = 'dev_' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('mmpi_current_device_id', currentId);
    }

    if (registeredDevices.includes(currentId)) {
        return true; // Sudah terdaftar
    }

    if (registeredDevices.length < 2) {
        registeredDevices.push(currentId);
        localStorage.setItem('mmpi_devices', JSON.stringify(registeredDevices));
        return true;
    }

    return false; // Batas 2 perangkat terlampaui
}

function mulaiTes() {
    const pwd = document.getElementById('password').value;
    const nama = document.getElementById('nama').value;
    const jk = document.getElementById('jk').value;

    if (pwd !== "kes105") {
        alert("Password salah! Gunakan password yang benar.");
        return;
    }

    if (!nama || !jk) {
        alert("Mohon lengkapi Nama dan Jenis Kelamin.");
        return;
    }

    if (!cekBatasPerangkat()) {
        alert("Akses ditolak! Tes ini sudah digunakan pada batas maksimal 2 perangkat.");
        return;
    }

    document.getElementById('login-view').style.display = 'none';
    document.getElementById('test-view').style.display = 'flex';
    initNav();
    renderSoal();
}

function initNav() {
    const grid = document.getElementById('nav-grid');
    grid.innerHTML = '';
    DATA_SOAL.forEach((_, i) => {
        const item = document.createElement('div');
        item.className = 'nav-item';
        item.id = `nav-${i}`;
        item.innerText = i + 1;
        item.onclick = () => { currentIndex = i; renderSoal(); };
        grid.appendChild(item);
    });
}

function renderSoal() {
    document.getElementById('q-count').innerText = `NOMOR ${currentIndex + 1} DARI 567`;
    document.getElementById('q-txt').innerText = DATA_SOAL[currentIndex];
    
    document.getElementById('btn-YA').className = 'btn-ans';
    document.getElementById('btn-TIDAK').className = 'btn-ans';
    if(jawaban[currentIndex] === 'YA') document.getElementById('btn-YA').classList.add('active-ya');
    if(jawaban[currentIndex] === 'TIDAK') document.getElementById('btn-TIDAK').classList.add('active-tidak');

    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('current'));
    const currentNav = document.getElementById(`nav-${currentIndex}`);
    if(currentNav) {
        currentNav.classList.add('current');
        currentNav.scrollIntoView({ behavior: 'auto', block: 'nearest' });
    }
}

function simpan(val) {
    jawaban[currentIndex] = val;
    document.getElementById(`nav-${currentIndex}`).classList.add('filled');
    renderSoal();
    setTimeout(() => { if (currentIndex < 566) { currentIndex++; renderSoal(); } }, 100);
}

function navigasi(s) {
    if (currentIndex + s >= 0 && currentIndex + s < 567) { currentIndex += s; renderSoal(); }
}

function selesai() {
    const sisa = jawaban.filter(a => a === null).length;
    if (sisa > 0) return alert(`Gagal Simpan! Masih ada ${sisa} soal yang belum Anda jawab.`);

    const nama = document.getElementById('nama').value.toUpperCase();
    const jk = document.getElementById('jk').value;
    const tgl = new Date().toLocaleString('id-ID');

    let konten = `LAPORAN HASIL TES KESEHATAN MENTAL\n`;
    konten += `--------------------------\n`;
    konten += `NAMA      : ${nama}\n`;
    konten += `JK        : ${jk}\n`;
    konten += `TANGGAL   : ${tgl}\n`;
    konten += `--------------------------\n\n`;

    jawaban.forEach((ans, index) => {
        konten += `${index + 1}. ${ans}\n`;
    });

    const blob = new Blob([konten], { type: 'text/plain' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `HASIL_KESWA_${nama.replace(/\s+/g, '_')}.txt`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>
</body>
</html>
